[project]
name = "sdo-skills-mcp"
version = "0.1.0"
description = "Serve the SDO writing skills (ETSI, 3GPP, ITU-T) over the Model Context Protocol"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "Jan.Reimes", email = "jan.reimes@head-acoustics.com" }
]
keywords = ["mcp", "fastmcp", "skills", "standards", "etsi", "3gpp", "itu-t"]
dependencies = [
    "fastmcp>=4.2.0",
    "typer>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/jr2804/sdo-skills-mcp"
Skills = "https://github.com/jr2804/sdo-skills"

[project.scripts]
sdo-skills-mcp = "sdo_skills_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdo_skills_mcp"]
artifacts = [
    "src/sdo_skills_mcp/profiles/*.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "tests/test-cache"
asyncio_mode = "auto"
addopts = "-v --tb=short --cov=sdo_skills_mcp --cov-report=term-missing --cov-fail-under=100"

[tool.codespell]
skip = "*.git,*.lock,*.min.js"
check-hidden = true
ignore-regex = "https?://|\b[A-Z]+\b"
